<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>إدارة المتجر | متجر عبيد</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a33;--blue:#1769ff;--ink:#18263b;--muted:#7a8799;--line:#e6ebf2;--bg:#f6f8fc;--green:#13805c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.container{width:min(1220px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;padding:15px 0;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;color:var(--navy)}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(140deg,#3185ff,#0649c8);color:white;display:grid;place-items:center}.top a.back{font-size:12px;color:var(--blue);font-weight:800}.layout{display:grid;grid-template-columns:225px 1fr;gap:18px;padding:25px 0 45px}.side,.main{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.side-top{padding:20px;background:var(--navy);color:white}.side-top small{color:#b8c9df;font-size:10px}.side-top h2{margin:4px 0;font-size:18px}.nav{padding:10px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:0;background:white;border-radius:10px;text-align:right;color:#64748b;font-size:12px;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:#edf4ff;color:var(--blue)}.nav span{font-size:18px;width:24px;text-align:center}.main{padding:23px;min-height:500px}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.heading h1{font-size:23px;margin:0;color:var(--navy)}.heading p{font-size:11px;color:var(--muted);margin:5px 0 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-size:11px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:white}.soft{background:#edf3ff;color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fbfcfe}.stat small{font-size:10px;color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:5px;color:var(--navy)}.notice{background:#fff7df;border:1px solid #f2dfaa;color:#825d12;border-radius:11px;padding:13px;font-size:11px;line-height:1.9;margin-bottom:18px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:right;padding:13px;border-bottom:1px solid var(--line);font-size:11px}th{background:#f7f9fd;color:#66758b;font-weight:900}td{background:white}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:7px;background:#e7f8ef;color:var(--green);padding:4px 8px;font-size:10px;font-weight:800}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #dce3ed;border-radius:9px;outline:0;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.subhead{font-size:15px;color:var(--navy);margin:22px 0 12px}.muted{color:var(--muted);font-size:11px;line-height:1.9}.footer{text-align:center;padding:18px;color:var(--muted);font-size:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr;gap:12px}.side-top{padding:13px 16px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:7px}.nav button{display:block;text-align:center;padding:9px 2px;font-size:9px}.nav span{display:block;width:auto;margin-bottom:3px}.main{padding:15px}.heading h1{font-size:19px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.stat b{font-size:20px}.form-grid{grid-template-columns:1fr}.bar{flex-wrap:wrap}}
</style></head><body><header class="top"><div class="container bar"><a class="brand" href="./"><span class="mark">ع</span> متجر عبيد <span style="font-size:10px;color:#7a8799;font-weight:600">/ لوحة الإدارة التجريبية</span></a><a class="back" href="./">← العودة للمتجر</a></div></header><main class="container layout"><aside class="side"><div class="side-top"><small>لوحة التحكم</small><h2>إدارة متجر عبيد</h2><small>معاينة محلية غير متصلة بخادم</small></div><nav class="nav"><button class="active" data-tab="overview"><span>▦</span>نظرة عامة</button><button data-tab="products"><span>▤</span>المنتجات</button><button data-tab="orders"><span>▧</span>الطلبات التجريبية</button><button data-tab="settings"><span>⚙</span>الإعدادات</button></nav></aside><section class="main" id="main"></section></main><footer class="footer">لوحة عرض تجريبية — لا توجد مصادقة إدارية أو قاعدة بيانات متصلة. لا تستخدمها لإدارة طلبات حقيقية.</footer>
<script>
const OKEY='obaidStoreOrdersV2',PKEY='obaidStoreAdminProductsV1';const seed=[{name:'سماعات لاسلكية بتصميم عصري',category:'صوتيات',price:19.99,stock:12},{name:'ساعة يد أنيقة للاستخدام اليومي',category:'إكسسوارات',price:34.5,stock:8},{name:'كاميرا تصوير بتفاصيل واضحة',category:'إلكترونيات',price:79,stock:4},{name:'حقيبة أنيقة وعملية لكل يوم',category:'موضة',price:28,stock:15},{name:'سماعة رأس مريحة بصوت نقي',category:'صوتيات',price:45,stock:6},{name:'حذاء رياضي خفيف وعصري',category:'موضة',price:39.99,stock:10},{name:'مصباح مكتبي بتصميم هادئ',category:'منزل',price:22,stock:9},{name:'نظارات شمسية بإطار أنيق',category:'إكسسوارات',price:17.5,stock:11}];let tab='overview';const $=id=>document.getElementById(id);const money=n=>'$'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function products(){return JSON.parse(localStorage.getItem(PKEY)||'null')||seed.map(p=>({...p}))}function orders(){return JSON.parse(localStorage.getItem(OKEY)||'[]')}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}function render(){const ps=products(),os=orders();let h='';if(tab==='overview'){h='<div class="heading"><div><h1>نظرة عامة</h1><p>ملخص البيانات التجريبية الموجودة على هذا الجهاز.</p></div><a class="btn soft" href="./">معاينة المتجر ↗</a></div><div class="notice"><b>تنبيه مهم:</b> هذه لوحة محلية للتجربة فقط. المنتجات التي تعدّلها هنا لا تتغير في واجهة المتجر الحالية إلا بعد ربط النظام بقاعدة بيانات، والطلبات لا تصل إلى مدير حقيقي.</div><div class="stats"><div class="stat"><small>منتجات في قائمة الإدارة</small><b>'+ps.length+'</b></div><div class="stat"><small>طلبات على هذا الجهاز</small><b>'+os.length+'</b></div><div class="stat"><small>قيمة الطلبات التجريبية</small><b>'+money(os.reduce((s,o)=>s+Number(o.total||0),0))+'</b></div><div class="stat"><small>حالة المتجر</small><b style="font-size:16px;color:#13805c">واجهة تجريبية</b></div></div><h3 class="subhead">إجراءات سريعة</h3><div class="actions"><button class="btn primary" onclick="setTab(\'products\')">إدارة المنتجات</button><button class="btn soft" onclick="setTab(\'orders\')">عرض الطلبات</button></div>'}
if(tab==='products'){h='<div class="heading"><div><h1>إدارة المنتجات</h1><p>إضافة وتعديل قائمة تجريبية محفوظة في هذا المتصفح.</p></div><button class="btn primary" onclick="productForm()">＋ إضافة منتج</button></div><div class="table-wrap"><table><thead><tr><th>اسم المنتج</th><th>القسم</th><th>السعر</th><th>الكمية</th><th>إجراءات</th></tr></thead><tbody>'+ps.map((p,i)=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.category)+'</td><td>'+money(p.price)+'</td><td>'+Number(p.stock||0)+'</td><td><div class="actions"><button class="btn soft" onclick="productForm('+i+')">تعديل</button><button class="btn" style="background:#fff0f1;color:#cf3e52" onclick="delProduct('+i+')">حذف</button></div></td></tr>').join('')+'</tbody></table></div><p class="muted">التغييرات في هذه الصفحة تجريبية ومحلية فقط، ولا تعدّل بيانات منتجات الصفحة الرئيسية بعد.</p>'}
if(tab==='orders'){h='<div class="heading"><div><h1>الطلبات التجريبية</h1><p>الطلبات التي تم تسجيلها من المتصفح نفسه فقط.</p></div><button class="btn soft" onclick="exportOrders()">تصدير CSV</button></div>';if(!os.length)h+='<div class="empty">لا توجد طلبات تجريبية على هذا الجهاز حالياً.</div>';else h+='<div class="table-wrap"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>'+os.map(o=>'<tr><td>'+esc(o.id)+'</td><td>'+esc(o.name)+'</td><td>'+esc(o.phone)+'</td><td>'+money(o.total)+'</td><td><span class="pill">'+esc(o.status||'تجريبي')+'</span></td><td>'+new Date(o.date).toLocaleDateString('ar')+'</td></tr>').join('')+'</tbody></table></div>'}
if(tab==='settings'){h='<div class="heading"><div><h1>الإعدادات</h1><p>أدوات محلية للتجربة فقط.</p></div></div><div class="notice">قبل استقبال زبائن حقيقيين، يلزم إعداد تسجيل دخول آمن للمدير، وقاعدة بيانات للمنتجات والطلبات، وتحقق من الصلاحيات، وخادم لحفظ الطلبات.</div><h3 class="subhead">البيانات التجريبية</h3><div class="actions"><button class="btn soft" onclick="resetProducts()">إرجاع قائمة المنتجات الافتراضية</button><button class="btn" style="background:#fff0f1;color:#cf3e52" onclick="clearOrders()">مسح الطلبات التجريبية</button></div><p class="muted">هذه الأوامر تمسح أو تعدّل بيانات التجربة في المتصفح الحالي فقط.</p>'}$('main').innerHTML=h}
function productForm(i=-1){let p=i>=0?products()[i]:{name:'',category:'إلكترونيات',price:'',stock:0};$('main').innerHTML='<div class="heading"><div><h1>'+(i>=0?'تعديل منتج':'إضافة منتج')+'</h1><p>احفظ المنتج في قائمة الإدارة المحلية.</p></div><button class="btn soft" onclick="setTab(\'products\')">رجوع</button></div><form onsubmit="saveProduct(event,'+i+')"><div class="form-grid"><div class="field"><label>اسم المنتج</label><input id="pn" required value="'+esc(p.name)+'"></div><div class="field"><label>القسم</label><select id="pc"><option '+(p.category==='إلكترونيات'?'selected':'')+'>إلكترونيات</option><option '+(p.category==='صوتيات'?'selected':'')+'>صوتيات</option><option '+(p.category==='منزل'?'selected':'')+'>منزل</option><option '+(p.category==='موضة'?'selected':'')+'>موضة</option><option '+(p.category==='إكسسوارات'?'selected':'')+'>إكسسوارات</option></select></div><div class="field"><label>السعر بالدولار</label><input id="pp" type="number" min="0" step=".01" required value="'+esc(p.price)+'"></div><div class="field"><label>الكمية التجريبية</label><input id="ps" type="number" min="0" step="1" required value="'+esc(p.stock)+'"></div></div><button class="btn primary">حفظ المنتج</button></form><p class="muted">لا يؤثر هذا النموذج على قائمة المنتجات الظاهرة للزبائن؛ الربط الفعلي يأتي مع قاعدة البيانات.</p>'}
function saveProduct(e,i){e.preventDefault();let ps=products(),p={name:$('pn').value.trim(),category:$('pc').value,price:Number($('pp').value),stock:Number($('ps').value)};if(i>=0)ps[i]=p;else ps.unshift(p);localStorage.setItem(PKEY,JSON.stringify(ps));setTab('products')}function delProduct(i){if(confirm('حذف هذا المنتج من القائمة التجريبية؟')){let ps=products();ps.splice(i,1);localStorage.setItem(PKEY,JSON.stringify(ps));render()}}function resetProducts(){if(confirm('إرجاع قائمة الإدارة إلى المنتجات الافتراضية؟')){localStorage.removeItem(PKEY);render()}}function clearOrders(){if(confirm('مسح كل الطلبات التجريبية المحفوظة على هذا الجهاز؟')){localStorage.removeItem(OKEY);render()}}function exportOrders(){const data=orders();if(!data.length){alert('لا توجد طلبات للتصدير.');return}const rows=[['رقم الطلب','الاسم','الهاتف','العنوان','الإجمالي','الحالة','التاريخ'],...data.map(o=>[o.id,o.name,o.phone,o.address,o.total,o.status,o.date])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='obaid-store-demo-orders.csv';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));render();
</script></body></html>
