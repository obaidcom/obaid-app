<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>حسابي وطلباتي | متجر عبيد</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a33;--blue:#1769ff;--ink:#18263b;--muted:#7a8799;--line:#e6ebf2;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button,input{font:inherit}.container{width:min(1160px,calc(100% - 30px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--navy);font-size:20px}.mark{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(140deg,#3185ff,#0649c8);color:white;border-radius:13px}.links{display:flex;gap:20px;font-size:12px;color:#5e6c80;font-weight:700}.btn{border:0;border-radius:10px;padding:11px 17px;font-size:12px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.soft{background:#edf3ff;color:var(--blue)}.crumb{font-size:11px;color:var(--muted);padding:20px 0}.pagehead{margin-bottom:20px}.pagehead h1{font-size:28px;margin:0;color:var(--navy)}.pagehead p{margin:6px 0;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;padding-bottom:50px}.side,.content{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}.side-head{padding:21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.avatar{width:47px;height:47px;border-radius:50%;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-size:22px}.side-head b{display:block;font-size:13px}.side-head small{color:var(--muted);font-size:10px}.side-nav{padding:10px}.side-nav button{display:flex;width:100%;text-align:right;align-items:center;gap:12px;background:white;border:0;border-radius:10px;padding:13px 12px;color:#637086;font-size:12px;font-weight:700;cursor:pointer}.side-nav button.active,.side-nav button:hover{background:#edf4ff;color:var(--blue)}.side-nav span{font-size:18px;width:24px;text-align:center}.content{padding:24px;min-height:390px}.content-title{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:20px}.content-title h2{font-size:19px;margin:0;color:var(--navy)}.content-title p{font-size:11px;color:var(--muted);margin:4px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat{background:#f7f9fd;border:1px solid var(--line);border-radius:13px;padding:16px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:22px;color:var(--navy);margin-top:5px}.order{border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}.order-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px;background:#fbfcfe;border-bottom:1px solid var(--line)}.order-top b{font-size:12px}.order-top small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.status{background:#fff5d9;color:#946200;border-radius:7px;padding:5px 9px;font-size:10px;font-weight:800}.order-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;font-size:11px}.order-bottom strong{font-size:14px;color:var(--navy)}.empty{text-align:center;padding:45px 10px;color:var(--muted)}.empty .symbol{font-size:44px}.empty h3{color:var(--ink);margin:10px 0 5px}.empty p{font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}.field{margin:7px 0 12px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:9px;background:#fff;font-size:12px;outline:0}.hint{font-size:10px;color:var(--muted);line-height:1.9}.foot{background:var(--navy);color:#aebdd1;padding:20px 0;text-align:center;font-size:10px}
@media(max-width:720px){.container{width:calc(100% - 22px)}.bar{flex-wrap:wrap}.brand{font-size:17px}.links{order:3;width:100%;justify-content:space-between;gap:10px;font-size:10px}.layout{grid-template-columns:1fr;gap:12px}.side-head{padding:13px 16px}.side-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px}.side-nav button{display:block;text-align:center;padding:10px 2px;font-size:9px}.side-nav span{display:block;width:auto;margin-bottom:4px}.content{padding:16px}.pagehead h1{font-size:23px}.stats{gap:7px}.stat{padding:12px 9px}.stat b{font-size:18px}.order-top,.order-bottom{padding:11px}.form-grid{grid-template-columns:1fr}.content-title h2{font-size:17px}}
</style></head><body><header class="top"><div class="container bar"><a class="brand" href="./"><span class="mark">ع</span><span>متجر عبيد</span></a><nav class="links"><a href="./">الرئيسية</a><a href="./#products">المنتجات</a><a href="./#categories">الأقسام</a><a href="account.html">حسابي وطلباتي</a></nav><a class="btn soft" href="./">متابعة التسوق ←</a></div></header><main class="container"><div class="crumb"><a href="./">الرئيسية</a>　/　حسابي</div><div class="pagehead"><h1>حسابي</h1><p>تابع طلباتك وأدر معلومات حسابك من مكان واحد.</p></div><div class="layout"><aside class="side"><div class="side-head"><div class="avatar">♙</div><div><b id="helloName">أهلاً بك في متجر عبيد</b><small>مساحة الحساب التجريبية</small></div></div><div class="side-nav"><button class="active" data-tab="orders"><span>▤</span>طلباتي</button><button data-tab="profile"><span>♙</span>الملف الشخصي</button><button data-tab="addresses"><span>⌖</span>العناوين</button><button data-tab="settings"><span>⚙</span>الإعدادات</button></div></aside><section class="content" id="content"></section></div></main><footer class="foot">© متجر عبيد — هذه صفحة واجهة تجريبية؛ لا توجد حسابات أو قاعدة بيانات مشتركة بعد.</footer>
<script>
const ORDER_KEY='obaidStoreOrdersV2',PROFILE_KEY='obaidStoreProfileV1';let current='orders';const $=id=>document.getElementById(id);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getOrders(){return JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')}function getProfile(){return JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}function money(n){return '$'+Number(n||0).toFixed(2)}
function show(tab){current=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const orders=getOrders(),profile=getProfile();if(profile.name)$('helloName').textContent=profile.name;let html='';
if(tab==='orders'){html='<div class="content-title"><div><h2>طلباتي</h2><p>عرض الطلبات التي تم تسجيلها من هذا الجهاز.</p></div><a class="btn soft" href="./#products">＋ تسوّق الآن</a></div><div class="stats"><div class="stat"><small>إجمالي الطلبات</small><b>'+orders.length+'</b></div><div class="stat"><small>إجمالي المشتريات</small><b>'+money(orders.reduce((s,o)=>s+Number(o.total||0),0))+'</b></div><div class="stat"><small>الطلبات الحالية</small><b>'+orders.length+'</b></div></div>';if(!orders.length)html+='<div class="empty"><div class="symbol">▤</div><h3>ما عندك طلبات حتى الآن</h3><p>لما تسجل طلب تجريبي من المتجر، راح يظهر هنا.</p><a class="btn primary" href="./#products">اكتشف المنتجات</a></div>';else html+=orders.map(o=>'<article class="order"><div class="order-top"><div><b>رقم الطلب: '+esc(o.id)+'</b><small>'+new Date(o.date).toLocaleString('ar')+'</small></div><span class="status">'+esc(o.status||'قيد المراجعة')+'</span></div><div class="order-bottom"><div>'+esc((o.items||[]).map(i=>i.name+' × '+i.qty).join('، '))+'<br><span style="color:#7a8799">الدفع: '+esc(o.payment||'غير محدد')+'</span></div><strong>'+money(o.total)+'</strong></div></article>').join('')}
if(tab==='profile')html='<div class="content-title"><div><h2>الملف الشخصي</h2><p>احفظ معلوماتك محلياً لتسهيل تعبئة النموذج.</p></div></div><form onsubmit="saveProfile(event)"><div class="form-grid"><div class="field"><label>الاسم الكامل</label><input id="name" required value="'+esc(profile.name)+'" placeholder="الاسم الكامل"></div><div class="field"><label>رقم الهاتف</label><input id="phone" type="tel" value="'+esc(profile.phone)+'" placeholder="رقم الهاتف"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" value="'+esc(profile.email)+'" placeholder="name@example.com"></div><div class="field"><label>المدينة</label><input id="city" value="'+esc(profile.city)+'" placeholder="المدينة"></div></div><button class="btn primary">حفظ المعلومات</button><p class="hint">تنبيه: هذه المعلومات تُحفظ في متصفح هذا الجهاز فقط، وليست حساباً مسجلاً في خادم.</p></form>';
if(tab==='addresses')html='<div class="content-title"><div><h2>عناوين التوصيل</h2><p>احفظ العنوان الذي تستخدمه عادةً.</p></div></div><form onsubmit="saveAddress(event)"><div class="field"><label>عنوان التوصيل</label><textarea id="address" rows="4" placeholder="المدينة، المنطقة، الشارع، أقرب علامة">'+esc(profile.address)+'</textarea></div><button class="btn primary">حفظ العنوان</button></form><p class="hint">العنوان المحفوظ محلي فقط؛ لا يتم إرسال طلب توصيل حقيقي في النسخة الحالية.</p>';
if(tab==='settings')html='<div class="content-title"><div><h2>الإعدادات</h2><p>إدارة بيانات هذه التجربة.</p></div></div><h3 style="font-size:14px">الخصوصية والبيانات</h3><p class="hint">المعلومات والطلبات محفوظة داخل تخزين المتصفح على جهازك. لا يوجد تسجيل دخول حقيقي أو مزامنة بين الأجهزة في هذه النسخة.</p><button class="btn soft" onclick="clearLocal()">مسح بيانات التجربة من هذا الجهاز</button><p class="hint">هذا الإجراء يحذف الطلبات وبيانات الحساب المحلية فقط.</p>';
$('content').innerHTML=html}
function saveProfile(e){e.preventDefault();let p=getProfile();Object.assign(p,{name:$('name').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),city:$('city').value.trim()});localStorage.setItem(PROFILE_KEY,JSON.stringify(p));$('helloName').textContent=p.name||'أهلاً بك في متجر عبيد';alert('تم حفظ المعلومات على هذا الجهاز.');show('profile')}
function saveAddress(e){e.preventDefault();let p=getProfile();p.address=$('address').value.trim();localStorage.setItem(PROFILE_KEY,JSON.stringify(p));alert('تم حفظ العنوان على هذا الجهاز.')}
function clearLocal(){if(confirm('هل تريد مسح طلبات وبيانات الحساب التجريبية من هذا الجهاز؟')){localStorage.removeItem(ORDER_KEY);localStorage.removeItem(PROFILE_KEY);show('orders')}}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show(location.hash==='#orders'?'orders':'orders');
</script></body></html>
